<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>郷札あわせ Prototype 01</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;background:#0d2740;color:#fff;touch-action:none}.game{height:100vh;display:grid;grid-template-rows:24% 56% 20%;position:relative}.lane{position:relative;background:#153b59;border-bottom:2px solid #6ea6c5;overflow:hidden}.lane:after{content:'追加札レーン  →';position:absolute;left:12px;top:8px;opacity:.65;font-weight:700}.card{position:absolute;width:72px;height:94px;border-radius:9px;background:#fff;color:#123;border:3px solid #d6e5ee;box-shadow:0 4px 12px #0008;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;user-select:none;touch-action:none}.card small{font-size:11px;margin-top:5px}.action{position:relative;background:linear-gradient(#235b78,#17455f);overflow:hidden}.hint{position:absolute;top:10%;width:100%;text-align:center;font-size:clamp(18px,3vw,34px);font-weight:900;text-shadow:0 2px 5px #000}.item{position:absolute;width:54px;height:54px;border-radius:50%;background:#ffe65a;color:#503800;display:none;align-items:center;justify-content:center;font-size:27px;box-shadow:0 0 20px #fff}.trail{position:absolute;border-radius:50%;width:16px;height:16px;background:#dff8ff;pointer-events:none;opacity:.7}.hand{position:relative;background:#102d45;padding:8px 62px;display:flex;align-items:center;justify-content:space-evenly;gap:4px}.slot{height:94px;flex:1;max-width:72px;min-width:34px;border:2px dashed #7095aa;border-radius:9px;position:relative}.slot .card{left:0;top:0;width:100%;height:100%;font-size:clamp(9px,1.4vw,16px)}.slot.hot{outline:4px solid #ffe65a;transform:translateY(-8px)}button{border:0;border-radius:10px;font-weight:900}.agari{position:absolute;right:8px;bottom:18px;width:43px;height:58px;background:#d93a32;color:white;font-size:14px;z-index:10}.sortbtn{position:absolute;left:8px;bottom:18px;width:43px;height:58px;background:#2d87b8;color:white;font-size:12px;line-height:1.05;z-index:10}.gear{position:absolute;right:12px;top:10px;width:44px;height:38px;background:#ffffff22;color:#fff;font-size:22px;z-index:20}.fullscreen{position:absolute;right:64px;top:10px;width:44px;height:38px;background:#ffffff22;color:#fff;font-size:19px;z-index:20}.panel{position:absolute;right:12px;top:54px;width:260px;background:#092033ee;padding:14px;border-radius:12px;z-index:30;display:none}.panel label{display:block;margin:9px 0}.panel input{width:100%}.status{position:absolute;left:12px;bottom:10px;background:#0006;padding:7px 10px;border-radius:8px}.dragging{z-index:50;transform:scale(1.08);pointer-events:none}.flash{animation:flash .25s 2}@keyframes flash{50%{filter:brightness(2)}}
.rotate{display:none;position:fixed;inset:0;background:#0d2740;z-index:99;align-items:center;justify-content:center;text-align:center;font-size:24px;padding:30px}@media(orientation:portrait){.rotate{display:flex}.game{display:none}}
</style></head><body><div class='rotate'>端末を横向きにしてください<br>郷札あわせ Prototype 01</div><div class='game' id='game'>
<div class='lane' id='lane'><button class='fullscreen' id='fullscreen' aria-label='全画面表示'>⛶</button><button class='gear' id='gear'>⚙</button></div>
<div class='action' id='action'><div class='hint' id='hint'>流れる札をつかんで、下の手札へ！</div><div class='item' id='item'>★</div><div class='status' id='status'>ITEM 0 / 交換 0</div></div>
<div class='hand' id='hand'><button class='sortbtn' id='sortbtn'>並び替え</button><button class='agari' id='agari'>あがり</button></div>
<div class='panel' id='panel'><b>TEST SETTINGS</b><label>横断時間 <span id='speedVal'></span><input id='speed' type='range' min='2' max='8' step='.5' value='4'></label><label>札の間隔 <span id='gapVal'></span><input id='gap' type='range' min='70' max='190' step='10' value='120'></label><label>アイテム判定 <span id='hitVal'></span><input id='hit' type='range' min='35' max='100' step='5' value='65'></label><label>ホールド時間 <span id='holdVal'></span><input id='hold' type='range' min='0.5' max='5' step='0.5' value='2'></label><button id='reset' style='width:100%;height:38px'>RESET</button></div>
</div><script>
const names=['大室山','金目鯛','東海館','伊東温泉','城ヶ崎','みかん','按針祭','小室山']; const icons=['▲','魚','館','♨','海','●','✦','△'];
const lane=document.querySelector('#lane'), action=document.querySelector('#action'), hand=document.querySelector('#hand'), item=document.querySelector('#item'), hint=document.querySelector('#hint'), status=document.querySelector('#status');
let settings={speed:4,gap:120,hit:65,hold:2000}, cards=[], lastSpawn=0, items=0, swaps=0, drag=null, itemTimer=0;
function makeCard(i){let c=document.createElement('div');c.className='card';c.dataset.i=i;c.innerHTML=`<div style="font-size:25px">${icons[i]}</div><small>${names[i]}</small>`;return c}
for(let n=0;n<12;n++){let s=document.createElement('div');s.className='slot';let i=Math.floor(Math.random()*names.length);s.append(makeCard(i));hand.insertBefore(s,hand.querySelector('.sortbtn'))}
function sortHand(){let slots=[...hand.querySelectorAll('.slot')];let ids=slots.map(s=>+(s.querySelector('.card')?.dataset.i??999)).sort((a,b)=>a-b);slots.forEach((s,n)=>{s.innerHTML='';if(ids[n]!==999)s.append(makeCard(ids[n]))});hint.textContent='手札を種類ごとに並び替えました';hint.classList.add('flash');setTimeout(()=>hint.classList.remove('flash'),600)}
function spawn(){let i=Math.floor(Math.random()*names.length), c=makeCard(i); c.style.left='-80px';c.style.top='38px';lane.append(c);cards.push({el:c,x:-80,i});c.addEventListener('pointerdown',startDrag)}
function startDrag(e){let obj=cards.find(x=>x.el===e.currentTarget);if(!obj||drag)return; drag={obj,el:obj.el,pointerId:e.pointerId,started:performance.now(),timer:null}; drag.el.classList.add('dragging'); drag.el.setPointerCapture?.(e.pointerId); moveDrag(e); window.addEventListener('pointermove',moveDrag);window.addEventListener('pointerup',endDrag,{once:true}); drag.timer=setTimeout(returnToLane,settings.hold)}
function moveDrag(e){if(!drag)return;let r=document.querySelector('#game').getBoundingClientRect();drag.el.style.position='fixed';drag.el.style.left=(e.clientX-36)+'px';drag.el.style.top=(e.clientY-47)+'px'; let ir=item.getBoundingClientRect(); if(item.style.display==='flex' && e.clientX>ir.left-settings.hit/2&&e.clientX<ir.right+settings.hit/2&&e.clientY>ir.top-settings.hit/2&&e.clientY<ir.bottom+settings.hit/2){items++;item.style.display='none';hint.textContent='アイテムGET！';hint.classList.add('flash');setTimeout(()=>hint.classList.remove('flash'),600)} document.querySelectorAll('.slot').forEach(s=>{let q=s.getBoundingClientRect();s.classList.toggle('hot',e.clientX>q.left&&e.clientX<q.right&&e.clientY>q.top&&e.clientY<q.bottom)})}
function returnToLane(){if(!drag)return;clearTimeout(drag.timer);window.removeEventListener('pointermove',moveDrag);let d=drag;d.el.classList.remove('dragging');d.el.style.position='absolute';d.el.style.left=d.obj.x+'px';d.el.style.top='38px';document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hot'));drag=null;hint.textContent='時間切れ！ 札は追加札レーンへ戻りました';hint.classList.add('flash');setTimeout(()=>hint.classList.remove('flash'),600);updateStatus()}
function endDrag(e){window.removeEventListener('pointermove',moveDrag);if(!drag)return;clearTimeout(drag.timer);let hot=document.querySelector('.slot.hot'); if(hot){let old=hot.querySelector('.card');old?.remove();let nc=makeCard(drag.obj.i);hot.append(nc);swaps++;hint.textContent=`${names[drag.obj.i]} に交換！`;drag.obj.el.remove();cards=cards.filter(x=>x!==drag.obj)}else{drag.el.classList.remove('dragging');drag.el.style.position='absolute';drag.el.style.left=drag.obj.x+'px';drag.el.style.top='38px'} document.querySelectorAll('.slot').forEach(s=>s.classList.remove('hot'));drag=null;updateStatus()}
function updateStatus(){status.textContent=`ITEM ${items} / 交換 ${swaps}`}
function showItem(){let ar=action.getBoundingClientRect();item.style.left=(20+Math.random()*(ar.width-90))+'px';item.style.top=(70+Math.random()*(ar.height-130))+'px';item.style.display='flex';setTimeout(()=>{item.style.display='none'},2200)}
function loop(t){if(drag){let remain=Math.max(0,(settings.hold-(t-drag.started))/1000);status.textContent=`ITEM ${items} / 交換 ${swaps} / HOLD ${remain.toFixed(1)}秒`}let pxPerMs=(lane.clientWidth+160)/(settings.speed*1000);if(t-lastSpawn>settings.gap/pxPerMs){spawn();lastSpawn=t}cards.forEach(o=>{if(drag&&drag.obj===o)return;o.x+=pxPerMs*16;o.el.style.left=o.x+'px'});cards.filter(o=>o.x>lane.clientWidth+80).forEach(o=>o.el.remove());cards=cards.filter(o=>o.x<=lane.clientWidth+80||(drag&&drag.obj===o)); if(t-itemTimer>4500){showItem();itemTimer=t}requestAnimationFrame(loop)}requestAnimationFrame(loop);
function bind(id,key,suffix){let el=document.querySelector(id),v=document.querySelector(id+'Val');function f(){settings[key]=+el.value;v.textContent=el.value+suffix}el.oninput=f;f()}bind('#speed','speed','秒');bind('#gap','gap','px');bind('#hit','hit','px');
{let el=document.querySelector('#hold'),v=document.querySelector('#holdVal');function f(){settings.hold=+el.value*1000;v.textContent=el.value+'秒'}el.oninput=f;f()}
document.querySelector('#sortbtn').onclick=sortHand;
const fsBtn=document.querySelector('#fullscreen');
function isFullscreen(){return !!(document.fullscreenElement||document.webkitFullscreenElement)}
async function toggleFullscreen(){
  try{
    if(!isFullscreen()){
      const target=document.documentElement;
      if(target.requestFullscreen) await target.requestFullscreen();
      else if(target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      else {hint.textContent='このブラウザでは全画面APIを利用できません。ホーム画面に追加して起動すると全画面に近い表示になります';hint.classList.add('flash');setTimeout(()=>hint.classList.remove('flash'),1200);return;}
    }else{
      if(document.exitFullscreen) await document.exitFullscreen();
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  }catch(e){hint.textContent='全画面表示に切り替えられませんでした';hint.classList.add('flash');setTimeout(()=>hint.classList.remove('flash'),900)}
}
function updateFsButton(){fsBtn.textContent=isFullscreen()?'↙':'⛶';fsBtn.setAttribute('aria-label',isFullscreen()?'全画面を終了':'全画面表示')}
fsBtn.onclick=toggleFullscreen;document.addEventListener('fullscreenchange',updateFsButton);document.addEventListener('webkitfullscreenchange',updateFsButton);
document.querySelector('#gear').onclick=()=>{let p=document.querySelector('#panel');p.style.display=p.style.display==='block'?'none':'block'};document.querySelector('#reset').onclick=()=>location.reload();document.querySelector('#agari').onclick=()=>{hint.textContent='あがり宣言！（判定はPrototype 02で実装）';hint.classList.add('flash');setTimeout(()=>hint.classList.remove('flash'),700)};
</script></body></html>
